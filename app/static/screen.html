<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0E1117">
  <title>Search for Luke · Projector</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 5l27 27-27 27L5 32z' fill='%230e1117' stroke='%233cc2b8' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="screen-body">
  <div class="noise"></div>
  <main id="screen-root" class="screen-root">
    <header class="screen-header"><div class="brand"><span class="brand-symbol">✦</span><div><small>IMPERIUM RESCUE COMMAND</small><strong>SEARCH FOR LUKE</strong></div></div><div class="screen-stage"><span id="screen-stage">S0 · LOBBY</span><strong id="screen-clock">--:--</strong></div></header>
    <section id="lobby-screen" class="projector-view lobby-screen">
      <div class="lobby-copy"><p class="kicker">CLASSROOM MISSION</p><h1>Search for <em>Luke</em></h1><p>Join the mission. Your clue card will unlock when the game begins.</p><div class="room-display"><span>ROOM CODE</span><strong id="screen-room">······</strong></div></div>
      <div class="qr-panel panel"><img id="room-qr" alt="QR code to join the mission"><span>SCAN TO JOIN</span></div>
      <div id="screen-rosters" class="screen-rosters"></div>
    </section>
    <section id="stage-screen" class="projector-view stage-screen" hidden>
      <div class="stage-copy"><span class="kicker" id="large-stage-label">MISSION STAGE</span><h1 id="large-stage-name">Briefing</h1><p id="large-instruction"></p></div>
      <div id="screen-map" class="screen-map panel"><svg viewBox="0 0 1000 600"><defs><filter id="screenGlow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="screenCloud"><feGaussianBlur stdDeviation="18"/></filter></defs><g class="orbits"><ellipse cx="100" cy="300" rx="170" ry="105"/><ellipse cx="100" cy="300" rx="340" ry="210"/><ellipse cx="100" cy="300" rx="570" ry="340"/><ellipse cx="100" cy="300" rx="790" ry="470"/></g><path class="planned-route" d="M115 300 C290 285 520 292 700 280"/><g class="veil-cloud"><ellipse cx="860" cy="250" rx="100" ry="72"/><circle cx="815" cy="240" r="48"/><circle cx="895" cy="230" r="54"/></g><g class="screen-debris"></g><g class="screen-places"></g></svg></div>
      <div id="team-progress" class="team-progress"></div>
    </section>
    <section id="questions-screen" class="projector-view questions-screen" hidden><div class="questions-head"><span class="kicker">MISSION DEBRIEF</span><h1>Discussion</h1></div><div id="questions-list"></div><div id="results-strip" class="results-strip"></div></section>
  </main>
  <script src="/static/screen.js" defer></script>
</body></html>
