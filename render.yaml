services:
  - type: web
    name: search-for-luke
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: search-for-luke-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: CLOCK_SPEED
        value: "1"
      - key: LLM_MODE
        value: live
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_TIMEOUT
        value: "60"

databases:
  - name: search-for-luke-db
    plan: 0.1c-256mb
    region: ohio
    databaseName: search_for_luke
    user: search_for_luke
    ipAllowList: []
